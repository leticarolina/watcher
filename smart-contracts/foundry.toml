[profile.default]
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "none" # do not include metadata hash in bytecode (for deterministic deployments)
use_literal_content = true # use source code
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
optimizer = true
optimizer_runs = 200
gas_limit = 30000000

# Foundry Fuzzing Configuration
[invariant]
runs = 256
depth = 50
call_override = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
